name: RDP-Win10

on:
  workflow_dispatch:

jobs:
  win10-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install QEMU & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm qemu-utils wget curl

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-win10-${{ github.run_id }}
          TS_IP=$(tailscale ip -4 | head -n 1)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Download Windows 10 Image
        run: |
          # ตัวอย่างการดึงไฟล์อิมเมจ Windows 10 (ต้องใส่ URL ไฟล์ .qcow2 หรือ .img ที่เตรียมไว้เอง)
          wget -O win10.qcow2 "${{ secrets.WIN10_IMAGE_URL }}"

      - name: Boot Windows 10 VM & Forward RDP
        run: |
          echo "=== RDP ACCESS ==="
          echo "Address : $TAILSCALE_IP:3389"
          echo "=================="

          sudo qemu-system-x86_64 \
            -enable-kvm \
            -m 6G \
            -smp 2 \
            -cpu host \
            -drive file=win10.qcow2,format=qcow2 \
            -netdev user,id=net0,hostfwd=tcp::3389-:3389 \
            -device e1000,netdev=net0 \
            -nographic
            
